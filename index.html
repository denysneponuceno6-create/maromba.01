<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarick Victor — Nutrição Estratégica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D;
    --bg-raise:#111111;
    --card:#1A1A1A;
    --card-hi:#1E1B12;
    --line:#262626;
    --line-soft:#1E1E1E;
    --gold:#C9A227;
    --gold-soft:rgba(201,162,39,0.14);
    --gold-dim:#8f7419;
    --text:#FFFFFF;
    --muted:#A1A1AA;
    --muted-dim:#6b6b72;
    --danger:#8a3b2e;
    --radius:2px;
    --radius-lg:4px;
    --maxw:1180px;
    --serif:'Oswald', sans-serif;
    --sans:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  ul{margin:0;padding:0;list-style:none;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--gold);color:#0D0D0D;}
  :focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--gold);
    text-transform:uppercase;display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--gold);display:inline-block;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0;text-transform:uppercase;}
  .muted{color:var(--muted);}

  /* ---------- Header ---------- */
  header.site{
    position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.86);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:var(--maxw);margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:34px;height:34px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--gold);font-size:14px;}
  .brand-name{font-family:var(--serif);letter-spacing:.08em;font-size:15px;text-transform:uppercase;}
  .brand-name span{color:var(--gold);}
  nav.links{display:flex;gap:34px;}
  nav.links a{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;transition:color .2s;position:relative;padding-bottom:3px;}
  nav.links a:hover{color:var(--text);}
  nav.links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .25s;}
  nav.links a:hover::after{width:100%;}
  .nav-cta{display:none;}
  @media(min-width:860px){.nav-cta{display:block;}}
  .btn-mini{border:1px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:9px 16px;text-transform:uppercase;transition:background .2s,color .2s;}
  .btn-mini:hover{background:var(--gold);color:#0D0D0D;}
  .hamburger{display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:6px;}
  .hamburger span{width:20px;height:1px;background:var(--text);}
  @media(min-width:860px){.hamburger{display:none;}}
  @media(max-width:859px){nav.links{display:none;}}

  /* ---------- Hero ---------- */
  .hero{
    padding:96px 0 64px;position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse 620px 320px at 82% -10%, rgba(201,162,39,0.10), transparent 60%),
      var(--bg);
    border-bottom:1px solid var(--line-soft);
  }
  .hero-grid{display:grid;gap:40px;align-items:end;}
  .hero-tag{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .hero-tag .sep{color:var(--muted-dim);}
  h1.headline{
    font-size:clamp(34px,6vw,64px);line-height:1.04;max-width:900px;
    font-weight:700;
  }
  h1.headline em{font-style:normal;color:var(--gold);}
  .hero-sub{margin-top:22px;max-width:560px;color:var(--muted);font-size:16px;}
  .hero-actions{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap;}
  .btn-gold{
    background:var(--gold);color:#0D0D0D;font-family:var(--mono);font-weight:600;
    font-size:12.5px;letter-spacing:.14em;padding:15px 26px;text-transform:uppercase;
    border:1px solid var(--gold);transition:background .2s,transform .15s;
  }
  .btn-gold:hover{background:#e0b52c;}
  .btn-gold:active{transform:translateY(1px);}
  .btn-outline{
    border:1px solid var(--line);color:var(--text);font-family:var(--mono);
    font-size:12.5px;letter-spacing:.14em;padding:15px 26px;text-transform:uppercase;
    transition:border-color .2s;
  }
  .btn-outline:hover{border-color:var(--gold);}
  .btn-block{display:block;width:100%;text-align:center;}

  .service-record{
    margin-top:54px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    border-top:1px solid var(--line-soft);padding-top:22px;
  }
  .service-record div{padding-right:20px;}
  .service-record .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted-dim);text-transform:uppercase;}
  .service-record .val{font-family:var(--serif);font-size:19px;margin-top:6px;text-transform:uppercase;}

  /* ---------- Section shell ---------- */
  section{padding:88px 0;}
  section.alt{background:var(--bg-raise);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
  .section-head{margin-bottom:52px;max-width:640px;}
  .section-head h2{font-size:clamp(26px,4vw,38px);margin-top:14px;}
  .section-head p{color:var(--muted);margin-top:14px;font-size:15.5px;}

  /* ---------- Rank stripes (signature element) ---------- */
  .rank{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .rank-stripes{display:flex;gap:3px;}
  .rank-stripes span{width:16px;height:3px;background:var(--gold-dim);}
  .rank-num{font-family:var(--serif);color:var(--gold);font-size:13px;letter-spacing:.1em;}

  /* ---------- Tier cards ---------- */
  .tiers{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:stretch;}
  .tier{
    background:var(--card);border:1px solid var(--line);padding:34px 30px 30px;
    display:flex;flex-direction:column;position:relative;
  }
  .tier.hi{border-color:var(--gold-dim);background:linear-gradient(180deg,var(--card-hi),var(--card) 40%);}
  .tier.hi::before{
    content:"MAIS PROCURADO";position:absolute;top:0;right:0;
    background:var(--gold);color:#0D0D0D;font-family:var(--mono);font-size:10px;
    letter-spacing:.12em;padding:6px 12px;font-weight:600;
  }
  .tier-icon{width:44px;height:44px;color:var(--gold);margin-bottom:22px;}
  .tier h3{font-size:20px;letter-spacing:.03em;}
  .tier .tagline{font-family:var(--mono);color:var(--muted);font-size:12px;letter-spacing:.06em;margin-top:8px;text-transform:none;}
  .tier-price{margin:26px 0 24px;padding-top:22px;border-top:1px solid var(--line-soft);}
  .tier-price .amount{font-family:var(--mono);font-size:30px;color:var(--gold);letter-spacing:.01em;}
  .tier-price .note{font-family:var(--mono);font-size:12px;color:var(--muted-dim);margin-left:4px;}
  .tier-price .sob{font-family:var(--serif);font-size:19px;color:var(--gold);letter-spacing:.06em;}
  .tier-items{flex:1;margin-bottom:30px;}
  .tier-items li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:14.5px;color:#d4d4d8;}
  .tier-items li:first-child{border-top:none;}
  .tier-items li svg{width:14px;height:14px;color:var(--gold);flex-shrink:0;margin-top:3px;}
  .tier-items li.plus{color:var(--muted);font-style:normal;}
  .tier-items li.plus b{color:var(--text);font-weight:500;}

  /* ---------- Comparison table ---------- */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);}
  table.compare{width:100%;border-collapse:collapse;min-width:640px;}
  table.compare th,table.compare td{padding:16px 20px;text-align:center;border-bottom:1px solid var(--line-soft);font-size:14px;}
  table.compare th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg-raise);}
  table.compare td:first-child,table.compare th:first-child{text-align:left;font-family:var(--sans);color:var(--text);white-space:nowrap;}
  table.compare th:first-child{background:var(--card);}
  table.compare tbody tr:last-child td{border-bottom:none;}
  table.compare td.yes{color:var(--gold);font-size:15px;}
  table.compare td.no{color:var(--muted-dim);}
  table.compare th.hi{color:var(--gold);}

  /* ---------- About ---------- */
  .about-grid{display:grid;gap:56px;grid-template-columns:1fr;}
  @media(min-width:900px){.about-grid{grid-template-columns:340px 1fr;}}
  .about-photo{
    aspect-ratio:4/5;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  }
  .about-photo svg{width:56%;color:var(--line);}
  .about-photo .frame-label{
    position:absolute;bottom:0;left:0;right:0;padding:14px 18px;
    background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  }
  .dossier{border:1px solid var(--line);background:var(--card);}
  .dossier-row{display:grid;grid-template-columns:170px 1fr;padding:16px 22px;border-top:1px solid var(--line-soft);}
  .dossier-row:first-child{border-top:none;}
  .dossier-row .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
  .dossier-row .v{font-size:14.5px;color:#d4d4d8;}
  .about-text p{color:var(--muted);font-size:15.5px;margin:0 0 16px;}
  .about-text p:last-child{margin-bottom:0;}

  /* ---------- Referral ---------- */
  .referral-box{
    border:1px solid var(--gold-dim);background:linear-gradient(135deg,var(--card-hi),var(--card));
    padding:48px;display:grid;gap:40px;grid-template-columns:1fr;
  }
  @media(min-width:860px){.referral-box{grid-template-columns:1fr 1fr;align-items:center;}}
  .referral-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .rtier{border:1px solid var(--line);padding:20px 14px;text-align:center;background:var(--bg);}
  .rtier .rt-label{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
  .rtier .rt-amt{font-family:var(--mono);font-size:24px;color:var(--gold);margin-top:8px;}

  /* ---------- Contact / footer ---------- */
  .contact-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  .contact-card{border:1px solid var(--line);background:var(--card);padding:28px;}
  .contact-card .eyebrow{margin-bottom:14px;}
  .contact-card p{color:var(--muted);font-size:14.5px;margin:10px 0 20px;}

  footer{border-top:1px solid var(--line-soft);padding:40px 0;}
  .footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center;}
  .footer-inner .muted{font-size:12.5px;font-family:var(--mono);letter-spacing:.04em;}

  /* ---------- Payment / Planos pages ---------- */
  .page-header{padding:44px 0 0;}
  .back-link{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted);display:inline-flex;gap:8px;align-items:center;text-transform:uppercase;}
  .back-link:hover{color:var(--gold);}
  .pay-grid{display:grid;gap:40px;grid-template-columns:1fr;padding:40px 0 100px;}
  @media(min-width:900px){.pay-grid{grid-template-columns:1fr 380px;}}
  .pay-form{border:1px solid var(--line);background:var(--card);padding:36px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:9px;}
  .field input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:13px 14px;font-size:14.5px;transition:border-color .2s;
  }
  .field input:focus{border-color:var(--gold);outline:none;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:520px){.field-row{grid-template-columns:1fr;}}
  .summary{border:1px solid var(--line);background:var(--card);padding:32px;height:fit-content;position:sticky;top:96px;}
  .summary h3{font-size:16px;letter-spacing:.04em;margin-bottom:6px;}
  .summary .plan-note{color:var(--muted);font-size:13px;margin-bottom:24px;}
  .summary-price{font-family:var(--mono);font-size:34px;color:var(--gold);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:20px 0;margin-bottom:22px;}
  .summary-price span{font-size:14px;color:var(--muted-dim);}
  .summary ul li{display:flex;gap:10px;font-size:13.5px;color:var(--muted);padding:7px 0;}
  .summary ul li svg{width:12px;height:12px;color:var(--gold);flex-shrink:0;margin-top:4px;}
  .success-panel{border:1px solid var(--gold-dim);background:var(--gold-soft);padding:26px;display:none;}
  .success-panel.show{display:block;}
  .success-panel .eyebrow{margin-bottom:10px;}
  .success-panel p{color:var(--muted);font-size:14px;margin:0;}

  /* Planos page */
  .plan-toggle{display:inline-flex;border:1px solid var(--line);margin-bottom:44px;}
  .plan-toggle button{padding:11px 22px;background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  .plan-toggle button.active{background:var(--gold);color:#0D0D0D;}
  .plan-cards{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));}
  .plan-cards[data-hidden="true"]{display:none;}
  .plan-card{border:1px solid var(--line);background:var(--card);padding:28px;}
  .plan-card h3{font-size:16px;letter-spacing:.05em;}
  .plan-card .p-price{font-family:var(--mono);color:var(--gold);font-size:26px;margin:16px 0 4px;}
  .plan-card .p-note{font-family:var(--mono);font-size:11.5px;color:var(--muted-dim);}
  .plan-card .save{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid var(--gold-dim);padding:3px 9px;}
  .plan-card ul{margin:20px 0 24px;}
  .plan-card ul li{font-size:13.5px;color:var(--muted);padding:6px 0;border-top:1px solid var(--line-soft);}
  .plan-card ul li:first-child{border-top:none;}

  .fade-in{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease;}
  .fade-in.in{opacity:1;transform:none;}

  #app{min-height:60vh;}
</style>
</head>

<header class="site">
  <div class="nav">
    <a href="#/" class="brand">
      <img src="onca-mascote.png" style="width: 80px; height: 80px;">

const COMPARE_ROWS = [

    features:["Tudo do Completo","1 chamada de vídeo mensal com Tarick","Prioridade máxima de atendimento"] },
];

/* ============ TEMPLATES ============ */
function tierCard(t){
  const priceBlock = t.price
    ? `<span class="amount">${t.price}</span><span class="note">${t.note}</span>`
    : `<span class="sob">SOB CONSULTA</span>`;
  const items = t.items.map(it=>{
    if(typeof it === "object" && it.plus){
      return `<li class="plus">${ICON.check}<span><b>${it.text}</b> +</span></li>`;
    }
    return `<li>${ICON.check}<span>${it}</span></li>`;
  }).join("");
  const ctaAttrs = t.external ? `target="_blank" rel="noopener"` : "";
  return `
  <article class="tier ${t.hi?'hi':''} fade-in">
    <div class="rank">
      <div class="rank-stripes">${Array.from({length:t.level}).map(()=>'<span></span>').join("")}</div>
      <span class="rank-num">NÍVEL ${t.roman}</span>
    </div>
    <div class="tier-icon">${t.icon}</div>
    <h3>${t.name}</h3>
    <div class="tagline">${t.tagline}</div>
    <div class="tier-price">${priceBlock}</div>
    <ul class="tier-items">${items}</ul>
    <a class="btn-gold btn-block" href="${t.href}" ${ctaAttrs}>${t.cta}</a>
  </article>`;
}

function compareCell(v){
  if(v==="yes") return `<td class="yes">${ICON.check}</td>`;
  if(v==="no") return `<td class="no">—</td>`;
  return `<td>${v}</td>`;
}

function compareTable(){
  const rows = COMPARE_ROWS.map(r=>`<tr><td>${r[0]}</td>${compareCell(r[1])}${compareCell(r[2])}${compareCell(r[3])}</tr>`).join("");
  return `
  <div class="table-scroll fade-in">
    <table class="compare">
      <thead><tr><th>Recurso</th><th>Consultoria</th><th class="hi">Nutrição + App</th><th>Completão</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

}

/* ============ FADE-IN OBSERVER ============ */
function observeFadeIns(){
  const els = document.querySelectorAll(".fade-in");
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("in")); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  },{threshold:0.12});
  els.forEach(el=>io.observe(el));
}

/* ============ ROUTER ============ */
function route(){
  const hash = window.location.hash || "#/";
  if(hash.startsWith("#/pagamento-")){
    const slug = hash.replace("#/pagamento-","");
    renderPayment(slug);
    window.scrollTo(0,0);
    return;
  }
  if(hash === "#/planos"){
    renderPlanos();
    window.scrollTo(0,0);
    return;
  }
  renderHome();
  if(hash && hash !== "#/" && hash !== "#"){
    const id = hash.replace("#","");
    requestAnimationFrame(()=>{
      const el = document.getElementById(id);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  } else {
    window.scrollTo(0,0);
  }
}
window.addEventListener("hashchange", route);
